[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-factory"
version = "0.1.0"
description = "24/7 automated coding pipeline: intake -> Codex/Antigravity agent -> verify -> PR"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
factory = "factory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "PLW", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
