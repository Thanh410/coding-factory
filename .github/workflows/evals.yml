name: evals

# Golden-task pass-rate for the factory. Runs the real engine against throwaway
# repos (PR creation is stubbed), so no repo state is touched. Use it to catch
# prompt/engine regressions before they reach the pipeline.
#
# Manual + weekly by default. Set the FACTORY_EVAL_MIN_PASS_RATE repository
# variable to gate (e.g. 0.8). The default backend is `llm` (Gemini/OpenRouter),
# which needs one of those secrets; override with the `backend` input.

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      backend:
        description: "Agent backend"
        default: "llm"
        type: choice
        options: [llm, codex, antigravity]

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FACTORY_BACKEND: ${{ github.event.inputs.backend || 'llm' }}
      FACTORY_LLM_CHAIN: ${{ vars.FACTORY_LLM_CHAIN || 'gemini,free,ollama' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install factory
        run: pip install -e ".[dev]"

      - name: Install Codex CLI
        if: ${{ (github.event.inputs.backend || 'llm') == 'codex' }}
        run: npm install -g @openai/codex

      - name: Run golden-task evals
        run: |
          factory eval \
            --backend "$FACTORY_BACKEND" \
            --suite evals/cases \
            --min-pass-rate "${{ vars.FACTORY_EVAL_MIN_PASS_RATE || '0' }}" \
            --verbose
