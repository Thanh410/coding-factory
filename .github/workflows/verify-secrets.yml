name: verify-secrets

# TEMPORARY diagnostic workflow. It never prints secret values - only whether
# each secret is set and whether the provider key is accepted (HTTP status).
# Delete this file once the check is done.

on:
  push:
    branches: [chore/verify-secrets]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Presence (set / empty) - values are never printed
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FACTORY_GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
        run: |
          for name in OPENAI_API_KEY OPENROUTER_API_KEY GEMINI_API_KEY FACTORY_GH_TOKEN; do
            val="${!name}"
            if [ -n "$val" ]; then
              echo "$name: SET (length ${#val})"
            else
              echo "$name: MISSING"
            fi
          done

      - name: Validate keys against providers (status only)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://generativelanguage.googleapis.com/v1beta/models?key=${GEMINI_API_KEY}")
            echo "GEMINI_API_KEY: HTTP $code  (200 = valid)"
          else
            echo "GEMINI_API_KEY: skipped (not set)"
          fi

          if [ -n "$OPENROUTER_API_KEY" ]; then
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
              "https://openrouter.ai/api/v1/key")
            echo "OPENROUTER_API_KEY: HTTP $code  (200 = valid)"
          else
            echo "OPENROUTER_API_KEY: skipped (not set)"
          fi

          if [ -n "$OPENAI_API_KEY" ]; then
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${OPENAI_API_KEY}" \
              "https://api.openai.com/v1/models")
            echo "OPENAI_API_KEY: HTTP $code  (200 = valid)"
          else
            echo "OPENAI_API_KEY: skipped (not set)"
          fi
